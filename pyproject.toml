[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketdata"
version = "0.1.0"
description = "QS desk market data: any symbol, any asset class, facts into SQLite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["marketdata*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
